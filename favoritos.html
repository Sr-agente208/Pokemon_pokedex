<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos — Pokédex</title><link rel="stylesheet" href="style.css"><style>body{background:#111;color:#fff}.container{text-align:center;background:transparent;box-shadow:none;max-width:1000px}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}.pokemon-card{width:220px;background:#ffffff18;border-radius:16px;padding:15px}.pokemon-card img{width:150px;max-width:100%}.pokemon-card button{background:#ba2634}footer{color:#aaa;margin-top:20px}</style></head><body><main class="container"><h1>⭐ Meus Favoritos</h1><button onclick="location.href='index.html'">⬅ Voltar</button><div class="grid" id="lista"></div><footer>v1.3 (Compatibilidade Máxima)</footer></main><script src="script.js"></script><script>(function(){var u=usuarioAtual();if(!u){location.href='login.html';return;}function local(){try{return JSON.parse(localStorage.getItem(chaveFavoritos()))||[];}catch(e){return [];}}function draw(items,online){var el=document.getElementById('lista'),out='',i;if(!items.length){el.innerHTML='<h2>😢 Você ainda não tem favoritos</h2>';return;}for(i=0;i<items.length;i++){var p=items[i];out+='<article class="pokemon-card"><h2>'+p.nome+'</h2><img src="'+p.imagem+'"><p>#'+p.numero+'</p><p>'+p.tipo+'</p><button onclick="remover('+i+','+(p.id||0)+')">🗑 Remover</button></article>';}el.innerHTML=out;window._items=items;window._online=online;}window.remover=function(index,id){var items=window._items||[];if(window._online&&id){api('DELETE','/favoritos/'+u.id+'/'+id,null,function(){carregar();},function(){alert('Não foi possível remover do servidor.');});}else{items.splice(index,1);localStorage.setItem(chaveFavoritos(),JSON.stringify(items));draw(items,false);}};function carregar(){if(u.id)api('GET','/favoritos/'+u.id,null,function(data){if(data.length){draw(data,true);}else draw(local(),false);},function(){draw(local(),false);});else draw(local(),false);}carregar();}());</script></body></html>
