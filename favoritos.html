<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⭐ Meus Favoritos - Pokédex</title>

<link rel="stylesheet" href="style.css">


<style>


body{

background:#111;

color:white;

}



.container{

padding:40px 20px;

text-align:center;

}



h1{

font-size:40px;

margin-bottom:30px;

}



button{

padding:12px 20px;

border:none;

border-radius:20px;

background:#ef5350;

color:white;

cursor:pointer;

margin:10px;

}



button:hover{

transform:scale(1.05);

}



#listaFavoritos{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:25px;

}



.pokemon-card{


width:250px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(10px);

border-radius:20px;

padding:20px;

box-shadow:0 0 20px black;


}



.pokemon-card img{

width:160px;

}



.tipo{


display:inline-block;

padding:8px 15px;

border-radius:20px;

background:#1976d2;

margin:10px;


}


.remover{

background:#d32f2f;

}



</style>


</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body>



<div class="container">


<h1>

⭐ Meus Favoritos

</h1>



<button onclick="voltar()">

⬅️ Voltar

</button>



<div id="listaFavoritos">

</div>



</div>





<script>



function carregarFavoritos(){


let favoritos =

JSON.parse(

localStorage.getItem("favoritos")

) || [];



const lista =

document.getElementById("listaFavoritos");



lista.innerHTML="";



if(favoritos.length === 0){


lista.innerHTML=

"<h2>Você ainda não tem favoritos 😢</h2>";


return;


}




favoritos.forEach((pokemon,index)=>{



lista.innerHTML += `


<div class="pokemon-card">


<h2>

${pokemon.nome}

</h2>



<img src="${pokemon.imagem}">



<p>

🔢 Número: #${pokemon.numero}

</p>



<div class="tipo">

${pokemon.tipo}

</div>



<br>



<button 

class="remover"

onclick="removerFavorito(${index})">

🗑 Remover

</button>



</div>


`;



});



}




function removerFavorito(index){



let favoritos =

JSON.parse(

localStorage.getItem("favoritos")

) || [];



favoritos.splice(index,1);



localStorage.setItem(

"favoritos",

JSON.stringify(favoritos)

);



carregarFavoritos();


}




function voltar(){


window.location.href="index.html";


}



carregarFavoritos();



</script>


</body>

</html>
