<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos — Pokédex</title><link rel="stylesheet" href="style.css"><style>body{background:linear-gradient(135deg,#1565c0,#7b1fa2);color:#fff;min-height:100vh;padding:20px;transition:1s}body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);z-index:-1}.container{max-width:1050px;margin:auto}.header-fav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(255,255,255,.90);border-radius:20px;box-shadow:0 10px 28px rgba(69,65,106,0.1);margin-bottom:30px;color:#172033}.header-fav h1{font-size:24px;margin:0;color:#1565c0}.header-fav button{background:linear-gradient(135deg,#1565c0,#7b1fa2);border:1px solid #fff;color:white;padding:8px 18px;border-radius:12px;font-weight:bold}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}.pokemon-card{width:220px;background:rgba(255,255,255,.90);border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,0.15);color:#172033;transition:transform .25s,box-shadow .25s;border:1px solid #fff}.pokemon-card:hover{transform:translateY(-5px);box-shadow:0 15px 35px rgba(0,0,0,0.25)}.pokemon-card h2{font-size:20px;margin:0 0 10px;text-transform:uppercase}.pokemon-card img{width:140px;filter:drop-shadow(0 8px 6px rgba(0,0,0,0.15));margin-bottom:12px}.pokemon-card p{margin:4px 0;color:#555;font-size:14px}.pokemon-card .numero{font-weight:bold;color:#1565c0}.pokemon-card button{background:#d75d69;border:none;color:white;padding:8px 16px;border-radius:12px;margin-top:14px;cursor:pointer;font-weight:bold;width:100%}footer{text-align:center;color:#b8c6d8;font-size:12px;margin-top:40px}</style></head><body><main class="container"><header class="header-fav"><h1>⭐ Meus Favoritos</h1><button onclick="location.href='index.html'">⬅ Voltar</button></header><div class="grid" id="lista"></div><footer>v1.3 (Compatibilidade Máxima)<br><p style="font-size:10px;color:#a0a4b8;margin-top:8px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.4">Este é um projeto de fã sem fins lucrativos, feito para fins de estudo e entretenimento. Pokémon e todos os nomes, imagens e sons associados são propriedade intelectual de Nintendo, Game Freak e The Pokémon Company.</p></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="script.js"></script><script>(function(){var u=usuarioAtual();if(!u){location.href='login.html';return;}function local(){try{return JSON.parse(localStorage.getItem(chaveFavoritos()))||[];}catch(e){return [];}}function aplicarTema(){var salvo=localStorage.getItem('temaPokedex'),modo=localStorage.getItem('modoPokedex')||'claro',t={cor1:'#1565c0',cor2:'#7b1fa2'};if(salvo)try{t=JSON.parse(salvo);}catch(e){}var gradiente='linear-gradient(135deg,'+t.cor1+','+t.cor2+')';document.body.style.background=modo==='escuro'?'#0b1018':gradiente;var header=document.querySelector('.header-fav');if(header){header.style.backgroundColor=modo==='escuro'?'#131d2a':'rgba(255,255,255,.90)';header.style.color=modo==='escuro'?'#f4f7ff':'#172033';header.querySelector('h1').style.color=t.cor1;header.querySelector('button').style.background=gradiente;}var cards=document.querySelectorAll('.pokemon-card');for(var i=0;i<cards.length;i++){cards[i].style.backgroundColor=modo==='escuro'?'#131d2a':'rgba(255,255,255,.90)';cards[i].style.color=modo==='escuro'?'#f4f7ff':'#172033';cards[i].querySelector('h2').style.color=t.cor1;cards[i].querySelector('.numero').style.color=t.cor2;cards[i].querySelector('p').style.color=modo==='escuro'?'#b7c8de':'#555';}}function draw(items,online){var el=document.getElementById('lista'),out='',i;if(!items.length){el.innerHTML='<h2>😢 Você ainda não tem favoritos</h2>';aplicarTema();return;}for(i=0;i<items.length;i++){var p=items[i];out+='<article class="pokemon-card"><h2>'+p.nome+'</h2><img src="'+p.imagem+'"><p class="numero">#'+p.numero+'</p><p>Tipo: '+p.tipo+'</p><button onclick="remover('+i+','+(p.id||0)+')">🗑 Remover</button></article>';}el.innerHTML=out;window._items=items;window._online=online;aplicarTema();}window.remover=function(index,id){var items=window._items||[];if(window._online&&id){api('DELETE','/favoritos/'+u.id+'/'+id,null,function(){carregar();},function(){alert('Não foi possível remover do servidor.');});}else{items.splice(index,1);localStorage.setItem(chaveFavoritos(),JSON.stringify(items));draw(items,false);}};function carregar(){if(u.id)api('GET','/favoritos/'+u.id,null,function(data){if(data.length){draw(data,true);}else draw(local(),false);},function(){draw(local(),false);});else draw(local(),false);}carregar();aplicarTema();window.addEventListener('load',aplicarTema);window.addEventListener('resize',aplicarTema);}());</script></body></html>
