<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Pokédex</title><link rel="stylesheet" href="style.css"></head><body><main class="login-box"><h1>⚡ Pokédex</h1><h2>Criar conta</h2><form onsubmit="return criarConta(event)"><input id="nome" placeholder="Nome" required><input id="email" type="email" placeholder="E-mail" required><input id="senha" type="password" placeholder="Senha" required><select id="cargo"><option value="Usuário">Usuário</option><option value="Assistente">Assistente de ADM (precisa de código)</option><option value="ADM">Administrador (precisa de código)</option></select><input id="codigo_verificacao" placeholder="Código de verificação (somente ADM/Assistente)"><button type="submit">✨ Criar conta</button></form><p>Já tem conta?</p><a href="login.html">🔓 Fazer login</a><hr><p><small>Já tentou cadastrar e ficou travado?</small></p><button type="button" onclick="limparDadosDispositivo()">🧹 Limpar dados deste dispositivo</button><footer>v1.3 (Compatibilidade Máxima)</footer></main><script src="script.js"></script></body></html>
