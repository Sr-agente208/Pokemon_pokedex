<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poké Pesquisa</title>

<meta name="description" content="Pesquise qualquer Pokémon">

<meta name="theme-color" content="#ef5350">

<link rel="icon"
href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#111;

color:white;

height:100vh;

background-size:contain;

background-repeat:no-repeat;

background-position:center;

transition:background-image 1s ease;

overflow-x:hidden;

}


body::before{

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

backdrop-filter:blur(4px);

z-index:-1;

}



main{

width:100%;

display:flex;

flex-direction:column;

align-items:center;

padding:40px 20px;

}



h1{

font-size:40px;

margin-bottom:25px;

text-shadow:0 0 15px black;

}



#usuarioArea{

position:absolute;

top:20px;

right:20px;

}



button{

padding:12px 20px;

border:none;

background:#ef5350;

color:white;

cursor:pointer;

border-radius:20px;

font-size:16px;

transition:.3s;

}


button:hover{

transform:scale(1.05);

background:#d32f2f;

}



form{

display:flex;

width:min(700px,90vw);

margin-bottom:25px;

}



input{

flex:1;

padding:18px;

font-size:18px;

border:none;

outline:none;

border-radius:40px 0 0 40px;

}



form button{

border-radius:0 40px 40px 0;

}



#card{

display:none;

width:min(850px,95vw);

background:rgba(255,255,255,.15);

backdrop-filter:blur(10px);

padding:30px;

border-radius:20px;

box-shadow:0 0 25px rgba(0,0,0,.45);

}



.topo{

display:flex;

flex-wrap:wrap;

justify-content:center;

align-items:center;

gap:25px;

}



#pokemonImg{

width:260px;

filter:drop-shadow(0 0 20px black);

}



.info{

flex:1;

min-width:250px;

}



.info h2{

font-size:34px;

}



.info p{

margin:10px 0;

font-size:18px;

}



#tipos{

display:flex;

gap:10px;

flex-wrap:wrap;

margin:15px 0;

}



.tipo{

padding:8px 15px;

border-radius:30px;

font-weight:bold;

text-transform:capitalize;

}



#acoes{

margin-top:20px;

display:flex;

gap:12px;

flex-wrap:wrap;

}


.botao{

background:#1976d2;

}



</style>

</head>


<body>


<div id="usuarioArea">

<button onclick="sair()">
🚪 Sair
</button>

</div>


<main>


<h1>🔍 Poké Pesquisa</h1>


<form id="formPesquisa">


<input

id="pesquisa"

placeholder="Digite o nome ou número do Pokémon...">


<button>

Pesquisar

</button>


</form>


<div id="erro"></div>



<div id="card">


<div class="topo">


<img id="pokemonImg">


<div class="info">


<h2 id="nomePokemon"></h2>


<p id="numeroPokemon"></p>


<div id="tipos"></div>


<p id="altura"></p>


<p id="peso"></p>


<p id="habilidades"></p>


<div id="acoes">


<button class="botao" id="som">

🔊 Ouvir Cry

</button>


<button class="botao" id="novoPokemon">

🎲 Aleatório

</button>


</div>


</div>


</div>

<script>

const TOTAL = 1025;

let cry = "";

let pokemonAtual = null;


const tiposCor = {

normal:"#A8A77A",
fire:"#EE8130",
water:"#6390F0",
electric:"#F7D02C",
grass:"#7AC74C",
ice:"#96D9D6",
fighting:"#C22E28",
poison:"#A33EA1",
ground:"#E2BF65",
flying:"#A98FF3",
psychic:"#F95587",
bug:"#A6B91A",
rock:"#B6A136",
ghost:"#735797",
dragon:"#6F35FC",
dark:"#705746",
steel:"#B7B7CE",
fairy:"#D685AD"

};


// =================
// LOGIN
// =================


if(!localStorage.getItem("logado")){

window.location.href="login.html";

}


function sair(){

localStorage.removeItem("logado");

window.location.href="login.html";

}



// =================
// WALLPAPER
// =================


async function trocarWallpaper(){

const numero=Math.floor(Math.random()*TOTAL)+1;


try{


const resposta=await fetch(

`https://pokeapi.co/api/v2/pokemon/${numero}`

);


const pokemon=await resposta.json();


document.body.style.backgroundImage=

`url(${pokemon.sprites.other["official-artwork"].front_default})`;


}catch(e){}


}


trocarWallpaper();


setInterval(trocarWallpaper,600000);



// =================
// PESQUISA
// =================


async function pesquisar(valor){


erro.style.display="none";


try{


const resposta=await fetch(

`https://pokeapi.co/api/v2/pokemon/${valor.toLowerCase()}`

);



if(!resposta.ok)

throw Error();



const pokemon=await resposta.json();


mostrarPokemon(pokemon);



}catch{


card.style.display="none";


erro.innerHTML="❌ Pokémon não encontrado";


erro.style.display="block";


}


}




// =================
// MOSTRAR POKEMON
// =================


function mostrarPokemon(p){


pokemonAtual = p;


card.style.display="block";



nomePokemon.innerHTML=

p.name.charAt(0).toUpperCase()+p.name.slice(1);



numeroPokemon.innerHTML=

"#"+p.id;



pokemonImg.src=

p.sprites.other["official-artwork"].front_default;



altura.innerHTML=

"📏 Altura: "+(p.height/10)+" m";



peso.innerHTML=

"⚖ Peso: "+(p.weight/10)+" kg";



habilidades.innerHTML=

"⭐ Habilidades: "+

p.abilities.map(h=>h.ability.name).join(", ");





tipos.innerHTML="";



p.types.forEach(t=>{


tipos.innerHTML += `


<div class="tipo"

style="background:${tiposCor[t.type.name] || "#666"}">

${t.type.name}

</div>


`;


});



// STATUS

hp.style.width=

Math.min(p.stats[0].base_stat,100)+"%";



atk.style.width=

Math.min(p.stats[1].base_stat,100)+"%";



def.style.width=

Math.min(p.stats[2].base_stat,100)+"%";



spd.style.width=

Math.min(p.stats[5].base_stat,100)+"%";



cry=

p.cries?.latest || "";



// BOTÕES

acoes.innerHTML += `


<button class="botao" onclick="favoritarPokemon()">

⭐ Favoritar

</button>


<button class="botao" onclick="baixarPDF()">

📄 PDF

</button>


<button class="botao" onclick="baixarWord()">

📝 Word

</button>


`;



}



// =================
// FAVORITOS
// =================


function favoritarPokemon(){


let favoritos =

JSON.parse(localStorage.getItem("favoritos")) || [];



favoritos.push({


nome:pokemonAtual.name,


imagem:

pokemonAtual.sprites.other["official-artwork"].front_default,


tipo:

pokemonAtual.types[0].type.name


});



localStorage.setItem(

"favoritos",

JSON.stringify(favoritos)

);



alert("⭐ Pokémon salvo nos favoritos!");



}



// =================
// PESQUISA FORM
// =================


formPesquisa.addEventListener(

"submit",

function(e){


e.preventDefault();


let valor=pesquisa.value.trim();



if(valor)

pesquisar(valor);



}

);




// =================
// ALEATÓRIO
// =================


novoPokemon.addEventListener(

"click",

function(){


let numero=

Math.floor(Math.random()*TOTAL)+1;


pesquisar(numero);


}

);



// =================
// CRY
// =================


som.addEventListener(

"click",

function(){


if(cry){


let audio=new Audio(cry);


audio.play();


}

}

);



// =================
// PDF
// =================


async function baixarPDF(){


alert(

"PDF será conectado na próxima etapa"

);


}



// =================
// WORD
// =================


async function baixarWord(){


alert(

"Word será conectado na próxima etapa"

);


}



// =================
// INICIAR
// =================


pesquisar(

Math.floor(Math.random()*TOTAL)+1

);


</script>


</body>

</html>
