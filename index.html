<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Poké Pesquisa</title>

<meta name="theme-color" content="#ef5350">

<link rel="icon"
href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#111;
color:white;
min-height:100vh;

background-size:contain;
background-repeat:no-repeat;
background-position:center;

transition:1s;

overflow-x:hidden;

}


body::before{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

backdrop-filter:blur(5px);

z-index:-1;

}


main{

display:flex;

flex-direction:column;

align-items:center;

padding:40px 20px;

}


h1{

font-size:40px;

text-shadow:0 0 20px black;

margin-bottom:30px;

}


#usuarioArea{

position:absolute;

top:20px;

right:20px;

display:flex;

gap:10px;

}


button{

border:none;

cursor:pointer;

padding:12px 20px;

border-radius:20px;

background:#ef5350;

color:white;

font-size:16px;

transition:.3s;

}


button:hover{

transform:scale(1.05);

background:#d32f2f;

}
#usuarioArea button{

background:#1976d2;

}



form{

display:flex;

width:min(700px,90vw);

}



input{

flex:1;

padding:18px;

font-size:18px;

border:none;

outline:none;

border-radius:40px 0 0 40px;

}



form button{

border-radius:0 40px 40px 0;

}



#erro{

margin:20px;

color:#ffaaaa;

font-weight:bold;

}



#card{

display:none;

margin-top:20px;

width:min(850px,95vw);

background:rgba(255,255,255,.15);

padding:30px;

border-radius:25px;

backdrop-filter:blur(10px);

box-shadow:0 0 30px black;

}



.topo{

display:flex;

flex-wrap:wrap;

align-items:center;

justify-content:center;

gap:30px;

}



#pokemonImg{

width:260px;

filter:drop-shadow(0 0 20px black);

}



.info{

min-width:280px;

}



.info h2{

font-size:35px;

}



.info p{

font-size:18px;

margin:10px 0;

}



#tipos{

display:flex;

gap:10px;

flex-wrap:wrap;

margin:15px 0;

}



.tipo{

padding:8px 15px;

border-radius:20px;

font-weight:bold;

text-transform:capitalize;

color:white;

}



#acoes{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}



.botao{

background:#1976d2;

}



.status{

margin-top:30px;

}



.barra{

margin:15px 0;

}



.fundoBarra{

height:18px;

background:#333;

border-radius:20px;

overflow:hidden;

}



.progresso{

height:100%;

width:0%;

background:linear-gradient(90deg,#42a5f5,#66bb6a);

transition:.8s;

}


</style>

</head>
<body>


<div id="usuarioArea">

<button onclick="location.href='favoritos.html'">
⭐ Favoritos
</button>


<button onclick="sair()">
🚪 Sair
</button>

</div>



<main>


<h1>
⚡ Poké Pesquisa
</h1>



<form id="formPesquisa">


<input

id="pesquisa"

type="text"

placeholder="Digite nome ou número do Pokémon..."

autocomplete="off"

>


<button>
🔍 Pesquisar
</button>


</form>



<div id="erro"></div>



<div id="card">


<div class="topo">


<img id="pokemonImg">



<div class="info">


<h2 id="nomePokemon"></h2>


<p id="numeroPokemon"></p>


<div id="tipos"></div>


<p id="altura"></p>


<p id="peso"></p>


<p id="habilidades"></p>



<div id="acoes">


<button class="botao" id="som">
🔊 Ouvir Cry
</button>


<button class="botao" id="novoPokemon">
🎲 Aleatório
</button>


</div>


</div>


</div>
