<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Poké Pesquisa</title>

<meta name="theme-color" content="#ef5350">

<link rel="icon"
href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;

}



body{

background:#111;

color:white;

min-height:100vh;

background-size:contain;

background-repeat:no-repeat;

background-position:center;

transition:1s;

overflow-x:hidden;

}



body::before{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

backdrop-filter:blur(5px);

z-index:-1;

}



main{

display:flex;

flex-direction:column;

align-items:center;

padding:40px 20px;

}



h1{

font-size:40px;

text-shadow:0 0 20px black;

margin-bottom:30px;

}



#usuarioArea{

position:absolute;

top:20px;

right:20px;

display:flex;

gap:10px;

}



button{

border:none;

cursor:pointer;

padding:12px 20px;

border-radius:20px;

background:#ef5350;

color:white;

font-size:16px;

transition:.3s;

}



button:hover{

transform:scale(1.05);

background:#d32f2f;

}



form{

display:flex;

width:min(700px,90vw);

}



input{

flex:1;

padding:18px;

font-size:18px;

border:none;

outline:none;

border-radius:40px 0 0 40px;

}



form button{

border-radius:0 40px 40px 0;

}



#erro{

margin:20px;

color:#ffaaaa;

}



#card{

display:none;

margin-top:20px;

width:min(850px,95vw);

background:rgba(255,255,255,.15);

padding:30px;

border-radius:25px;

backdrop-filter:blur(10px);

box-shadow:0 0 30px black;

}



.topo{

display:flex;

flex-wrap:wrap;

align-items:center;

justify-content:center;

gap:30px;

}



#pokemonImg{

width:260px;

filter:drop-shadow(0 0 20px black);

}



.info{

min-width:280px;

}



.info h2{

font-size:35px;

}



.info p{

font-size:18px;

margin:10px 0;

}



#tipos{

display:flex;

gap:10px;

flex-wrap:wrap;

margin:15px 0;

}



.tipo{

padding:8px 15px;

border-radius:20px;

font-weight:bold;

text-transform:capitalize;

}



#acoes{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}



.botao{

background:#1976d2;

}



.status{

margin-top:30px;

}



.barra{

margin:15px 0;

}



.fundoBarra{

height:18px;

background:#333;

border-radius:20px;

overflow:hidden;

}



.progresso{

height:100%;

width:0%;

background:linear-gradient(90deg,#42a5f5,#66bb6a);

transition:.8s;

}



</style>

</head><body>


<div id="usuarioArea">


<button onclick="location.href='favoritos.html'">

⭐ Favoritos

</button>


<button onclick="sair()">

🚪 Sair

</button>


</div>



<main>


<h1>
⚡ Poké Pesquisa
</h1>



<form id="formPesquisa">


<input

id="pesquisa"

type="text"

placeholder="Digite nome ou número do Pokémon..."

autocomplete="off"



>


<button>

🔍 Pesquisar

</button>


</form>



<div id="erro"></div>



<div id="card">



<div class="topo">



<img

id="pokemonImg"

src=""

>



<div class="info">



<h2 id="nomePokemon"></h2>



<p id="numeroPokemon"></p>



<div id="tipos"></div>



<p id="altura"></p>



<p id="peso"></p>



<p id="habilidades"></p>




<div id="acoes">



<button

class="botao"

id="som"

>

🔊 Ouvir Cry

</button>




<button

class="botao"

id="novoPokemon"

>

🎲 Aleatório

</button>



</div>



</div>



</div>





<div class="status">



<div class="barra">


<span>❤️ HP</span>


<div class="fundoBarra">

<div id="hp" class="progresso"></div>

</div>


</div>





<div class="barra">


<span>⚔️ Ataque</span>


<div class="fundoBarra">

<div id="atk" class="progresso"></div>

</div>


</div>





<div class="barra">


<span>🛡️ Defesa</span>


<div class="fundoBarra">

<div id="def" class="progresso"></div>

</div>


</div>





<div class="barra">


<span>⚡ Velocidade</span>


<div class="fundoBarra">

<div id="spd" class="progresso"></div>

</div>


</div>



</div>



</div>



</main>

<script>


const TOTAL = 1025;


let cry = "";

let pokemonAtual = null;



const tiposCor = {


normal:"#A8A77A",

fire:"#EE8130",

water:"#6390F0",

electric:"#F7D02C",

grass:"#7AC74C",

ice:"#96D9D6",

fighting:"#C22E28",

poison:"#A33EA1",

ground:"#E2BF65",

flying:"#A98FF3",

psychic:"#F95587",

bug:"#A6B91A",

rock:"#B6A136",

ghost:"#735797",

dragon:"#6F35FC",

dark:"#705746",

steel:"#B7B7CE",

fairy:"#D685AD"


};



// ======================
// LOGIN
// ======================


window.onload=function(){


if(!localStorage.getItem("logado")){


window.location.href="login.html";


}



pesquisar(

Math.floor(Math.random()*TOTAL)+1

);



trocarWallpaper();


};





function sair(){


localStorage.removeItem("logado");


window.location.href="login.html";


}




// ======================
// WALLPAPER
// ======================


async function trocarWallpaper(){


try{


let numero=Math.floor(Math.random()*TOTAL)+1;


let resposta=await fetch(

`https://pokeapi.co/api/v2/pokemon/${numero}`

);



let pokemon=await resposta.json();



document.body.style.backgroundImage=

`url(${pokemon.sprites.other["official-artwork"].front_default})`;



}catch(e){}



}



setInterval(trocarWallpaper,600000);





// ======================
// PESQUISA
// ======================


async function pesquisar(valor){



erro.style.display="none";



try{


let resposta=await fetch(

`https://pokeapi.co/api/v2/pokemon/${valor.toLowerCase()}`

);



if(!resposta.ok)

throw Error();



let pokemon=await resposta.json();



mostrarPokemon(pokemon);



}catch{


card.style.display="none";


erro.innerHTML="❌ Pokémon não encontrado";


erro.style.display="block";


}



}





// ======================
// MOSTRAR POKEMON
// ======================


function mostrarPokemon(p){


pokemonAtual=p;


card.style.display="block";



nomePokemon.innerHTML=

p.name.charAt(0).toUpperCase()+p.name.slice(1);



numeroPokemon.innerHTML=

"🔢 Número: #"+p.id;



pokemonImg.src=

p.sprites.other["official-artwork"].front_default;



altura.innerHTML=

"📏 Altura: "+(p.height/10)+" m";



peso.innerHTML=

"⚖️ Peso: "+(p.weight/10)+" kg";



habilidades.innerHTML=

"⭐ Habilidades: "+

p.abilities.map(

h=>h.ability.name

).join(", ");





tipos.innerHTML="";



p.types.forEach(t=>{


tipos.innerHTML+=`


<div class="tipo"

style="background:${tiposCor[t.type.name]}">

${t.type.name}

</div>


`;



});





hp.style.width=

Math.min(p.stats[0].base_stat,100)+"%";



atk.style.width=

Math.min(p.stats[1].base_stat,100)+"%";



def.style.width=

Math.min(p.stats[2].base_stat,100)+"%";



spd.style.width=

Math.min(p.stats[5].base_stat,100)+"%";





cry=p.cries?.latest || "";





// limpa botões antigos

acoes.innerHTML=`


<button class="botao" id="som">

🔊 Ouvir Cry

</button>



<button class="botao" id="novoPokemon">

🎲 Aleatório

</button>



<button class="botao"

onclick="favoritarPokemon()">

⭐ Favoritar

</button>



<button class="botao"

onclick="baixarPDF()">

📄 PDF

</button>



<button class="botao"

onclick="baixarWord()">

📝 Word

</button>


`;



document.getElementById("som")
.onclick=ouvirCry;



document.getElementById("novoPokemon")
.onclick=aleatorio;



}




// ======================
// FAVORITOS
// ======================


function favoritarPokemon(){



if(!pokemonAtual)return;



let favoritos =

JSON.parse(

localStorage.getItem("favoritos")

) || [];



favoritos.push({


nome:pokemonAtual.name,


numero:pokemonAtual.id,


imagem:

pokemonAtual.sprites.other["official-artwork"].front_default,


tipo:

pokemonAtual.types[0].type.name


});



localStorage.setItem(

"favoritos",

JSON.stringify(favoritos)

);



alert("⭐ Pokémon salvo nos favoritos!");



}





// ======================
// FORM PESQUISA
// ======================


formPesquisa.addEventListener(

"submit",

(e)=>{


e.preventDefault();



let valor=pesquisa.value.trim();



if(valor)

pesquisar(valor);



}

);





// ======================
// ALEATÓRIO
// ======================


function aleatorio(){


let numero=

Math.floor(Math.random()*TOTAL)+1;


pesquisar(numero);


}




// ======================
// CRY
// ======================


function ouvirCry(){


if(cry){


let audio=new Audio(cry);


audio.volume=.7;


audio.play();


}


}




// ======================
// PDF E WORD
// ======================

async function baixarPDF(){


if(!pokemonAtual){

alert("Pesquise um Pokémon primeiro!");

return;

}



const { jsPDF } = window.jspdf;


const pdf = new jsPDF();



let p = pokemonAtual;



// ======================
// FUNDO DA CAPA
// ======================


pdf.setFillColor(220,40,40);

pdf.rect(

0,

0,

210,

297,

"F"

);




// ======================
// POKEBOLA
// ======================


pdf.setFillColor(255,255,255);

pdf.circle(

105,

70,

35,

"F"

);



pdf.setFillColor(0,0,0);

pdf.circle(

105,

70,

12,

"F"

);



pdf.setFillColor(255,255,255);

pdf.circle(

105,

70,

6,

"F"

);




// ======================
// TITULO
// ======================


pdf.setTextColor(255,255,255);


pdf.setFontSize(28);


pdf.text(

"POKÉDEX",

75,

130

);



pdf.setFontSize(16);


pdf.text(

"Ficha Pokémon",

75,

145

);





// ======================
// SEGUNDA PÁGINA
// ======================


pdf.addPage();




pdf.setTextColor(0,0,0);



pdf.setFontSize(22);


pdf.text(

p.name.toUpperCase(),

20,

30

);



pdf.setFontSize(14);


pdf.text(

"Numero: #"+p.id,

20,

45

);





// ======================
// IMAGEM
// ======================


const img =

p.sprites.other["official-artwork"].front_default;



pdf.addImage(

img,

"PNG",

60,

55,

90,

90

);






// ======================
// INFORMAÇÕES
// ======================



let y=165;



pdf.text(

"Tipo: "+

p.types.map(t=>t.type.name).join(", "),

20,

y

);



y+=10;



pdf.text(

"Altura: "+(p.height/10)+" m",

20,

y

);



y+=10;



pdf.text(

"Peso: "+(p.weight/10)+" kg",

20,

y

);



y+=10;



pdf.text(

"Habilidades: "+

p.abilities.map(

a=>a.ability.name

).join(", "),

20,

y

);





// ======================
// STATUS
// ======================



function barra(nome,valor,y){



pdf.text(

nome,

20,

y

);



pdf.setFillColor(

230,

230,

230

);



pdf.rect(

70,

y-5,

100,

8,

"F"

);



pdf.setFillColor(

50,

180,

80

);



pdf.rect(

70,

y-5,

valor,

8,

"F"

);



}



barra(

"HP",

Math.min(p.stats[0].base_stat,100),

225

);



barra(

"ATK",

Math.min(p.stats[1].base_stat,100),

240

);



barra(

"DEF",

Math.min(p.stats[2].base_stat,100),

255

);



barra(

"SPD",

Math.min(p.stats[5].base_stat,100),

270

);





pdf.save(

`${p.name}-pokedex.pdf`

);


}




</script>


</body>

</html>
