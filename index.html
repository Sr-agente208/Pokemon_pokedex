<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Poké Pesquisa</title>

<meta name="theme-color" content="#ef5350">


<link rel="icon"
href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">


<!-- Biblioteca PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;

}



body{

background:#111;

color:white;

min-height:100vh;

background-size:contain;

background-repeat:no-repeat;

background-position:center;

transition:1s;

overflow-x:hidden;

}



body::before{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

backdrop-filter:blur(5px);

z-index:-1;

}




main{

display:flex;

flex-direction:column;

align-items:center;

padding:40px 20px;

}



h1{

font-size:40px;

text-shadow:0 0 20px black;

margin-bottom:30px;

}




#usuarioArea{

position:absolute;

top:20px;

right:20px;

display:flex;

gap:10px;

}




button{

border:none;

cursor:pointer;

padding:12px 20px;

border-radius:20px;

background:#ef5350;

color:white;

font-size:16px;

transition:.3s;

}



button:hover{

transform:scale(1.05);

background:#d32f2f;

}




form{

display:flex;

width:min(700px,90vw);

}




input{

flex:1;

padding:18px;

font-size:18px;

border:none;

outline:none;

border-radius:40px 0 0 40px;

}




form button{

border-radius:0 40px 40px 0;

}




#erro{

margin:20px;

color:#ffaaaa;

}




#card{

display:none;

margin-top:20px;

width:min(850px,95vw);

background:rgba(255,255,255,.15);

padding:30px;

border-radius:25px;

backdrop-filter:blur(10px);

box-shadow:0 0 30px black;

}




.topo{

display:flex;

flex-wrap:wrap;

align-items:center;

justify-content:center;

gap:30px;

}




#pokemonImg{

width:260px;

filter:drop-shadow(0 0 20px black);

}




.info{

min-width:280px;

}




.info h2{

font-size:35px;

}




.info p{

font-size:18px;

margin:10px 0;

}
