<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Poké Pesquisa</title>

<meta name="theme-color" content="#ef5350">


<link rel="icon"
href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">




<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#111;

color:white;

min-height:100vh;

background-size:contain;

background-repeat:no-repeat;

background-position:center;

transition:1s;

overflow-x:hidden;

}


body::before{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

backdrop-filter:blur(5px);

z-index:-1;

}


main{

display:flex;

flex-direction:column;

align-items:center;

padding:40px 20px;

}


h1{

font-size:40px;

text-shadow:0 0 20px black;

margin-bottom:30px;

}


#usuarioArea{

position:absolute;

top:20px;

right:20px;

display:flex;

gap:10px;

}


button{

border:none;

cursor:pointer;

padding:12px 20px;

border-radius:20px;

background:#ef5350;

color:white;

font-size:16px;

}


button:hover{

transform:scale(1.05);

}


form{

display:flex;

width:min(700px,90vw);

}


input{

flex:1;

padding:18px;

font-size:18px;

border:none;

outline:none;

border-radius:40px 0 0 40px;

}


form button{

border-radius:0 40px 40px 0;

}


#erro{

margin:20px;

color:#ffaaaa;

}


#card{

display:none;

margin-top:20px;

width:min(850px,95vw);

background:rgba(255,255,255,.15);

padding:30px;

border-radius:25px;

backdrop-filter:blur(10px);

}


.topo{

display:flex;

flex-wrap:wrap;

justify-content:center;

align-items:center;

gap:30px;

}


#pokemonImg{

width:260px;

filter:drop-shadow(0 0 20px black);

}


.info{

min-width:280px;

}


.info h2{

font-size:35px;

}


#tipos{

display:flex;

gap:10px;

flex-wrap:wrap;

}


.tipo{

padding:8px 15px;

border-radius:20px;

font-weight:bold;

}


#acoes{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}


.botao{

background:#1976d2;

}

</style>

</head>


<body>


<div id="usuarioArea">


<button onclick="location.href='favoritos.html'">

⭐ Favoritos

</button>


<button onclick="sair()">

🚪 Sair

</button>


</div>



<main>


<h1>
⚡ Poké Pesquisa
</h1>



<form id="formPesquisa">


<input
id="pesquisa"
type="text"
placeholder="Digite nome ou número do Pokémon..."
autocomplete="off"
>


<button>

🔍 Pesquisar

</button>


</form>



<div id="erro"></div>




<div id="card">



<div class="topo">



<img
id="pokemonImg"
src=""
>



<div class="info">



<h2 id="nomePokemon"></h2>


<p id="numeroPokemon"></p>


<div id="tipos"></div>


<p id="altura"></p>


<p id="peso"></p>


<p id="habilidades"></p>



<div id="acoes">


<button class="botao" onclick="ouvirCry()">

🔊 Ouvir Cry

</button>



<button class="botao" onclick="aleatorio()">

🎲 Aleatório

</button>



<button class="botao" onclick="favoritarAtual()">

⭐ Favoritar

</button>



<button class="botao" onclick="baixarPDF()">

📄 PDF

</button>



<button class="botao" onclick="baixarWord()">

📝 Word

</button>



</div>



</div>


</div>





<div class="status">



<h3>📊 Status</h3>



<p>❤️ HP</p>

<div class="fundoBarra">

<div id="hp" class="progresso"></div>

</div>



<p>⚔️ Ataque</p>

<div class="fundoBarra">

<div id="atk" class="progresso"></div>

</div>




<p>🛡️ Defesa</p>

<div class="fundoBarra">

<div id="def" class="progresso"></div>

</div>



<p>⚡ Velocidade</p>

<div class="fundoBarra">

<div id="spd" class="progresso"></div>

</div>



</div>



</div>



</main>

<script>

const TOTAL = 1025;

let cry = "";

let pokemonAtual = null;



const tiposCor = {

normal:"#A8A77A",
fire:"#EE8130",
water:"#6390F0",
electric:"#F7D02C",
grass:"#7AC74C",
ice:"#96D9D6",
fighting:"#C22E28",
poison:"#A33EA1",
ground:"#E2BF65",
flying:"#A98FF3",
psychic:"#F95587",
bug:"#A6B91A",
rock:"#B6A136",
ghost:"#735797",
dragon:"#6F35FC",
dark:"#705746",
steel:"#B7B7CE",
fairy:"#D685AD"

};



// LOGIN

window.onload=function(){

if(!localStorage.getItem("logado")){

window.location.href="login.html";

return;

}


aleatorio();

trocarWallpaper();

};





// SAIR

function sair(){

localStorage.removeItem("logado");

window.location.href="login.html";

}




// WALLPAPER

async function trocarWallpaper(){

try{


let numero =
Math.floor(Math.random()*TOTAL)+1;


let resposta =
await fetch(
`https://pokeapi.co/api/v2/pokemon/${numero}`
);



let pokemon =
await resposta.json();



document.body.style.backgroundImage =

`url(${pokemon.sprites.other["official-artwork"].front_default})`;



}catch(e){

console.log(e);

}


}



setInterval(trocarWallpaper,600000);





// PESQUISA

async function pesquisar(valor){


try{


let resposta =
await fetch(

`https://pokeapi.co/api/v2/pokemon/${valor.toLowerCase()}`

);



if(!resposta.ok){

throw Error();

}



let pokemon =
await resposta.json();



mostarPokemon(pokemon);



}

catch{


document.getElementById("card").style.display="none";


document.getElementById("erro").innerHTML=

"❌ Pokémon não encontrado";


}



}





// MOSTRAR POKEMON

function mostrarPokemon(p){


pokemonAtual=p;



document.getElementById("card").style.display="block";



nomePokemon.innerHTML =
p.name.toUpperCase();



numeroPokemon.innerHTML =
"🔢 Número: #"+p.id;



pokemonImg.src =
p.sprites.other["official-artwork"].front_default;



altura.innerHTML =
"📏 Altura: "+(p.height/10)+"m";



peso.innerHTML =
"⚖️ Peso: "+(p.weight/10)+"kg";



habilidades.innerHTML =

"⭐ Habilidades: "+

p.abilities.map(

a=>a.ability.name

).join(", ");





tipos.innerHTML="";



p.types.forEach(t=>{


tipos.innerHTML += `

<div class="tipo"

style="background:${tiposCor[t.type.name]}">

${t.type.name}

</div>

`;



});




hp.style.width =
Math.min(p.stats[0].base_stat,100)+"%";


atk.style.width =
Math.min(p.stats[1].base_stat,100)+"%";


def.style.width =
Math.min(p.stats[2].base_stat,100)+"%";


spd.style.width =
Math.min(p.stats[5].base_stat,100)+"%";



cry =
p.cries?.latest || "";



}






// PESQUISA PELO FORM

formPesquisa.addEventListener(

"submit",

function(e){


e.preventDefault();


let valor =
pesquisa.value.trim();



if(valor){

pesquisar(valor);

}


}

);






// ALEATÓRIO

function aleatorio(){


let numero =
Math.floor(Math.random()*TOTAL)+1;


pesquisar(numero);


}






// CRY

function ouvirCry(){


if(cry){


let audio =
new Audio(cry);


audio.play();


}


}






// FAVORITO

function favoritarAtual(){


if(!pokemonAtual){

alert("Pesquise um Pokémon primeiro!");

return;

}



let favoritos =

JSON.parse(

localStorage.getItem("favoritos")

)||[];




favoritos.push({


nome:pokemonAtual.name,


numero:pokemonAtual.id,


imagem:
pokemonAtual.sprites.other["official-artwork"].front_default,


tipo:
pokemonAtual.types[0].type.name


});



localStorage.setItem(

"favoritos",

JSON.stringify(favoritos)

);



alert("⭐ Pokémon salvo nos favoritos!");



}






// PDF

async function baixarPDF(){


if(!pokemonAtual){

alert("Pesquise um Pokémon!");

return;

}



const {jsPDF}=window.jspdf;



let pdf=new jsPDF();



let p=pokemonAtual;



pdf.setFillColor(220,40,40);

pdf.rect(0,0,210,297,"F");



pdf.setTextColor(255,255,255);

pdf.setFontSize(30);


pdf.text(

"⚡ POKÉDEX",

60,

50

);



pdf.addPage();



pdf.setTextColor(0,0,0);


pdf.text(

p.name.toUpperCase(),

20,

30

);



pdf.text(

"Número: #"+p.id,

20,

45

);



pdf.save(`${p.name}.pdf`);

}



// WORD

async function baixarWord(){


if(!pokemonAtual){

alert("Pesquise um Pokémon!");

return;

}



let p = pokemonAtual;



const {Document,Packer,Paragraph,HeadingLevel} = window.docx;



const doc = new Document({

sections: [{

properties: {},

children: [

new Paragraph({

text: p.name.toUpperCase(),

heading: HeadingLevel.HEADING_1,
}),
new Paragraph({

text: `Número: #${p.id}`,
}),
]

}]

});



Packer.toBlob(doc).then(blob => {

const url = window.URL.createObjectURL(blob);

const a = document.createElement('a');

a.href = url;

a.download = `${p.name}.docx`;

a.click();

window.URL.revokeObjectURL(url);

});

}

</script>
