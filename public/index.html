<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex</title><link rel="stylesheet" href="style.css"><style>body{background:#eef4ff}.app{max-width:900px;margin:24px auto;padding:18px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top #perfil{margin-right:auto;font-weight:bold}.card,.mural{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #1232}.hidden{display:none}.pokemon{display:flex;justify-content:center;gap:25px;align-items:center;flex-wrap:wrap;text-align:center}.pokemon img{width:220px;max-width:70vw}.badge{font-size:.75em;padding:4px 8px;border-radius:12px;color:#fff}.ADM{background:#cf2634}.Assistente{background:#e37813}.Usuário{background:#6c757d}.recado{border-bottom:1px solid #ddd;padding:12px 0}.recado:last-child{border:0}.recado button{float:right;padding:5px 9px;background:#b02a37}#modal{position:fixed;inset:0;background:#0009;padding:8vh 5%;overflow:auto}.modalBox{background:white;max-width:800px;margin:auto;padding:25px;border-radius:16px}.grupo{padding:10px}.grupo li{display:flex;justify-content:space-between;gap:12px;padding:7px;border-bottom:1px solid #eee}footer{text-align:center;color:#666;font-size:12px;margin-top:22px}</style></head><body><div class="app"><header class="top"><span id="perfil"></span><button onclick="location.href='favoritos.html'">⭐ Favoritos</button><button id="adm" class="hidden" onclick="abrirPainel()">💼 Painel ADM</button><button onclick="sair()">🚪 Sair</button></header><section class="card"><h1>⚡ Pokédex</h1><form id="busca"><input id="q" placeholder="Nome ou número do Pokémon" required><button>🔍 Pesquisar</button><button type="button" onclick="buscar(Math.floor(Math.random()*1025+1))">🎲 Aleatório</button></form><div id="resultado"></div></section><section class="mural"><h2>💬 Mural de recados</h2><form id="formRecado"><textarea id="texto" placeholder="Deixe seu recado" required></textarea><button>Enviar recado</button></form><div id="recados"></div></section><footer>v1.3 (Compatibilidade Máxima)</footer></div><div id="modal" class="hidden"><div class="modalBox"><button onclick="fecharPainel()">Fechar</button><h2>💼 Painel administrativo</h2><div id="usuarios"></div></div></div><script src="script.js"></script><script>(function(){var u=usuarioAtual(),atual=null; if(!localStorage.getItem('logado')||!u){location.href='login.html';return;}document.getElementById('perfil').innerHTML='👤 '+u.nome+' ('+u.cargo+')';if(u.cargo==='ADM'||u.cargo==='Assistente')document.getElementById('adm').className='';function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}window.buscar=function(valor){valor=valor||document.getElementById('q').value;var x=new XMLHttpRequest();x.open('GET','https://pokeapi.co/api/v2/pokemon/'+String(valor).toLowerCase(),true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status===200){var p=JSON.parse(x.responseText);atual=p;document.getElementById('resultado').innerHTML='<div class="pokemon"><img src="'+p.sprites.other['official-artwork'].front_default+'"><div><h2>'+esc(p.name.toUpperCase())+' #'+p.id+'</h2><p>Tipos: '+esc(p.types.map(function(t){return t.type.name;}).join(', '))+'</p><p>Altura: '+p.height/10+' m · Peso: '+p.weight/10+' kg</p><button onclick="favoritarPokemon(atualPokemon())">⭐ Favoritar</button></div></div>';}else document.getElementById('resultado').innerHTML='<p>Pokémon não encontrado.</p>';};x.send();};window.atualPokemon=function(){return atual;};document.getElementById('busca').onsubmit=function(e){e.preventDefault();buscar();};function recados(){api('GET','/recados',null,function(data){var out='',i;for(i=0;i<data.length;i++){var r=data[i],del=(u.cargo==='ADM'||u.cargo==='Assistente')?'<button onclick="apagarRecado('+r.id+')">Excluir</button>':'';out+='<div class="recado">'+del+'<strong>'+esc(r.nome)+'</strong> <span class="badge '+r.cargo+'">'+esc(r.cargo)+'</span><p>'+esc(r.mensagem)+'</p></div>';}document.getElementById('recados').innerHTML=out||'<p>Nenhum recado ainda.</p>';},function(){document.getElementById('recados').innerHTML='<p>Não foi possível carregar o mural.</p>';});}window.apagarRecado=function(id){api('DELETE','/recados/'+id,{cargo:u.cargo},recados,function(d){alert(d.erro);});};document.getElementById('formRecado').onsubmit=function(e){e.preventDefault();api('POST','/recados',{nome:u.nome,mensagem:document.getElementById('texto').value,cargo:u.cargo},function(){document.getElementById('texto').value='';recados();},function(d){alert(d.erro||'Não foi possível enviar.');});};window.abrirPainel=function(){document.getElementById('modal').className='';api('GET','/usuarios',null,function(list){var cargos=['ADM','Assistente','Usuário'],out='',i,j;for(i=0;i<cargos.length;i++){out+='<div class="grupo"><h3>'+cargos[i]+'</h3><ul>';for(j=0;j<list.length;j++)if(list[j].cargo===cargos[i])out+='<li>'+esc(list[j].nome)+' — '+esc(list[j].email)+(u.cargo==='ADM'&&list[j].id!==u.id?'<button onclick="apagarUsuario('+list[j].id+')">Excluir</button>':'')+'</li>';out+='</ul></div>';}document.getElementById('usuarios').innerHTML=out;});};window.fecharPainel=function(){document.getElementById('modal').className='hidden';};window.apagarUsuario=function(id){if(confirm('Excluir esta conta?'))api('DELETE','/usuarios/'+id,{cargo:u.cargo},abrirPainel,function(d){alert(d.erro);});};recados();buscar(Math.floor(Math.random()*1025+1));}());</script></body></html>
