<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Pokédex</title><link rel="stylesheet" href="style.css"></head><body><main class="login-box"><h1>⚡ Pokédex</h1><h2>Criar conta</h2><form onsubmit="return criarConta(event)"><input id="nome" placeholder="Nome" required><input id="email" type="email" placeholder="E-mail" required><input id="senha" type="password" placeholder="Senha" required><select id="cargo" onchange="atualizarCampoCodigo()"><option value="Usuário">Usuário</option><option value="Assistente">Assistente de ADM (precisa de código)</option><option value="ADM">Administrador (precisa de código)</option></select><div id="areaCodigo" style="display:none"><input id="codigo_verificacao" placeholder="Código de verificação recebido do ADM"><small>Somente Assistente e ADM precisam de código.</small></div><p id="avisoCargo"><small>Você está criando uma conta de Usuário. Não precisa de código.</small></p><button type="submit">✨ Criar conta</button></form><p>Já tem conta?</p><a href="login.html">🔓 Fazer login</a><hr><p><small>Já tentou cadastrar e ficou travado?</small></p><button type="button" onclick="limparDadosDispositivo()">🧹 Limpar dados deste dispositivo</button><footer>v1.3 (Compatibilidade Máxima)</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="script.js"></script></body></html>
